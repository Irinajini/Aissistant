name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Trouver et décompresser le projet ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouvé à la racine du dépôt."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          # Si le ZIP contient un dossier racine, on le détecte automatiquement.
          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            PROJECT_DIR="project"
          else
            PROJECT_DIR=$(find project -maxdepth 2 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Gradle Android introuvable dans le ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet détecté : $PROJECT_DIR"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBoltAssistant-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
