name: APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Télécharger le dépôt
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      # 2. Installer Java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installer Android SDK
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      # 4. Installer les composants Android
      - name: Installer Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Trouver et décompresser le ZIP
      - name: Trouver et décompresser le projet ZIP
        shell: bash
        run: |
          set -e

          echo "=== Recherche du ZIP ==="

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf extracted
          mkdir -p extracted

          echo "=== Décompression ==="

          unzip -q "$ZIP" -d extracted

          echo "=== Contenu du ZIP ==="
          find extracted -maxdepth 5 -type f | head -200

          echo "=== Recherche du projet Gradle ==="

          PROJECT_DIR=""

          while IFS= read -r GRADLE_FILE; do

            DIR=$(dirname "$GRADLE_FILE")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -f "$DIR/gradlew" ]; then
                PROJECT_DIR="$DIR"
                break
              fi

            fi

          done < <(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \))

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "❌ PROJET GRADLE ANDROID INTROUVABLE"
            echo ""
            echo "Fichiers Gradle trouvés :"
            find extracted -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" -o \
              -name "gradlew" \
            ) -print
            echo ""
            echo "Structure complète :"
            find extracted -maxdepth 4 -type d
            exit 1
          fi

          echo ""
          echo "✅ Projet Android trouvé :"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Donner les permissions à Gradle
      - name: Préparer Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      # 7. Compiler l'APK
      - name: Compiler l'APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # 8. Récupérer l'APK
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBoltAssistant-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      # 9. Résumé
      - name: Résultat
        run: |
          echo "======================================"
          echo "        BUILD TERMINÉ AVEC SUCCÈS"
          echo "======================================"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk"
