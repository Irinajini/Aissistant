name: Build BoltFire AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          # Si le projet est déjà décompressé à la racine
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Found Gradle project at root."
            exit 0
          fi

          # Chercher le fichier ZIP
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No Android project or ZIP found."
            echo "Files in current directory:"
            ls -la
            exit 1
          fi

          echo "Found ZIP file: $ZIP_FILE"

          # Extraire le ZIP
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted. Files in extracted:"
          ls -la extracted/

          # Chercher le dossier qui contient le projet Android
          # Le ZIP contient souvent un dossier parent comme "BoltFireAI_V15_1_AutoLab"
          # On cherche récursivement settings.gradle
          SETTINGS="$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)"

          if [[ -z "$SETTINGS" ]]; then
            echo "No settings.gradle found in extracted files."
            echo "Searching for any .gradle file:"
            find extracted -name "*.gradle" 2>/dev/null || true
            exit 1
          fi

          # On remonte jusqu'à la racine du projet (dossier parent du dossier app)
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Checking project structure in: $(pwd)"
          ls -la

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          # Vérifier que le dossier app existe
          if [[ ! -d app ]]; then
            echo "ERROR: app/ directory not found!"
            echo "Contents of project dir:"
            ls -la
            exit 1
          fi

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure OK."

      - name: Install Gradle 8.7 directly
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.7"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

          echo "Downloading Gradle $GRADLE_VERSION..."

          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            "$GRADLE_URL" \
            -o "$GRADLE_ZIP"

          rm -rf "$GRADLE_HOME"
          mkdir -p "$GRADLE_HOME"

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_HOME"

          echo "GRADLE_BIN=$GRADLE_HOME/gradle-$GRADLE_VERSION/bin/gradle" >> "$GITHUB_ENV"

          "$GRADLE_HOME/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "=== Building BoltFire APK ==="
          echo "Working directory: $(pwd)"
          echo "Gradle: $GRADLE_BIN"
          echo "Java:"
          java -version

          # Vérifier les fichiers avant le build
          echo "Files before build:"
          ls -la

          # Nettoyer le cache Gradle si nécessaire
          rm -rf .gradle

          # Build avec Gradle 8.7
          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "APK was not generated."
            echo "Searching for APK files:"
            find "$PROJECT_DIR/app/build" -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltFire-AI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
