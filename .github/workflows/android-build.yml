name: Build BoltFire AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository contents ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=== Searching for Android project ==="

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No settings.gradle found."
            echo "The ZIP does not appear to contain a Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Gradle project found, but app directory is missing."
            echo "Project directory: $PROJECT_DIR"
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Project contents ==="
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "Gradle Wrapper not found."
            echo "Generating Gradle Wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== Generated APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltFire-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
