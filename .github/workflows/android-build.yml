name: Build ColorBolt Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Trouver et décompresser le projet ZIP
        shell: bash
        run: |
          set -e

          echo "=== Recherche du ZIP ==="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Aucun fichier ZIP trouvé"
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          echo "=== Décompression ==="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Contenu du ZIP ==="
          find extracted -maxdepth 3 -type f | head -100

      - name: Rechercher le projet Gradle
        shell: bash
        run: |
          set -e

          echo "=== Recherche du projet Gradle ==="

          GRADLE_DIR=""

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            GRADLE_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$GRADLE_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              GRADLE_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$GRADLE_DIR" ]; then
            echo "❌ Aucun projet Gradle trouvé."
            echo ""
            echo "Fichiers trouvés :"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "✅ Projet Gradle trouvé : $GRADLE_DIR"

          echo "=== Contenu du projet ==="
          ls -la "$GRADLE_DIR"

          echo "=== Préparation Gradle ==="

          cd "$GRADLE_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "❌ gradlew introuvable."
            exit 1
          fi

      - name: Compiler l'APK
        shell: bash
        run: |
          set -e

          cd "$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBolt-Assistant-debug
          path: |
            extracted/**/build/outputs/apk/**/*.apk
            extracted/**/build/outputs/apk/*.apk
          if-no-files-found: error
