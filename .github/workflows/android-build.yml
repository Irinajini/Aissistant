name: Build BoltFire Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          find . -maxdepth 4 -type f | sort | head -300

          echo "=== Searching for Gradle project ==="

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir=$(dirname "$file")

            if [ -d "$dir/app" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android Gradle project found."
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Project contents ==="
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "Gradle Wrapper missing."
            echo "Generating Gradle Wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building BoltFire ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== Generated APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltFire-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
